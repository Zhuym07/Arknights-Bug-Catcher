<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263040">
  <meta name="description" content="25 秒内点按原石虫，拦截四个红门的来袭，守住中央蓝门。单机离线小游戏。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>源石防线</title>
</head>
<body>
  <main class="app-shell">
    <div class="game-frame">
      <header class="command-bar">
        <div class="hud" aria-label="行动记录">
          <div class="timer"><span>剩余</span><strong id="time">25</strong><small>s</small></div>
          <div><span>拦截</span><strong id="score">00</strong></div>
          <div class="leak-count"><span>漏网</span><strong id="leaks">00</strong></div>
        </div>
        <div class="tools">
          <button class="tool" id="retro-button" aria-label="复古画面" aria-pressed="true" data-tooltip="复古画面：开"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 8h10M7 12h10"/></svg></button>
          <button class="tool" id="pause-button" aria-label="暂停行动" data-tooltip="暂停" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg></button>
          <button class="tool" id="fullscreen-button" aria-label="切换全屏" data-tooltip="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        </div>
      </header>
    <section class="game-stage" aria-label="源石防线游戏场景">
      <canvas id="game" aria-label="原石虫从四个红门绕过高台进入中央蓝门，点按原石虫拦截"></canvas>
      <div id="countdown" class="countdown" aria-live="assertive" hidden></div>
      <div class="screen" id="screen">
        <div class="screen-content">
          <h1 id="screen-title">源石防线</h1>
          <p class="screen-copy" id="screen-copy">点按原石虫，守住中央蓝门。</p>
          <div class="result-tally" id="result-tally" hidden>
            <span class="result-caption">成功拦截</span>
            <div class="result-number"><strong id="result-score">00</strong><span>只</span></div>
            <p class="result-secondary">漏网 <strong id="result-leaks">00</strong> 只</p>
          </div>
          <button id="start-button" class="start-button" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg><span id="button-label">载入素材…</span>
          </button>
        </div>
      </div>
    </section>
    </div>
    <span class="sr-only" id="offline-status" role="status">准备离线缓存…</span>
    <p class="rotate-hint">横屏或全屏游玩，拦截更顺手</p>
    <noscript>请启用 JavaScript 以运行游戏。</noscript>
  </main>
  <p class="sr-only" id="live-status" aria-live="polite"></p>
  <script src="./game.js" type="module"></script>
</body>
</html>
